# Tiny Tapeout project information
# Do not change!
yaml_version: 6

project:
  title:        "Hierarchical FP compare-and-swap (sign, exponent, mantissa early exit)"
  author:       "PES University capstone team"
  discord:      ""
  description:  "Compares two FP32 numbers field by field (sign, then exponent, then mantissa) and stops at the first field that decides; reports 1-3 cycles used."
  language:     "Verilog"
  clock_hz:     10000000
  tiles:        "1x1"
  top_module:   "tt_um_hier_fp_cas"
  source_files:
    - "project.v"

pinout:
  ui[0]: "data bit 0"
  ui[1]: "data bit 1"
  ui[2]: "data bit 2"
  ui[3]: "data bit 3"
  ui[4]: "data bit 4"
  ui[5]: "data bit 5"
  ui[6]: "data bit 6"
  ui[7]: "data bit 7"
  uo[0]: "result byte bit 0"
  uo[1]: "result byte bit 1"
  uo[2]: "result byte bit 2"
  uo[3]: "result byte bit 3"
  uo[4]: "result byte bit 4"
  uo[5]: "result byte bit 5"
  uo[6]: "result byte bit 6"
  uo[7]: "result byte bit 7"
  uio[0]: "WR (load strobe)"
  uio[1]: "SEL0 (result byte select)"
  uio[2]: "SEL1"
  uio[3]: "SEL2"
  uio[4]: "DONE (output)"
  uio[5]: "CYC0 cycles used (output)"
  uio[6]: "CYC1 cycles used (output)"
  uio[7]: ""

